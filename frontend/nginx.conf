# Serves the built SPA and proxies everything the Django backend owns
# (API, admin, WebSocket) to the backend container under the same origin —
# this is why the frontend is built with VITE_API_BASE_URL=/api (relative):
# it sidesteps CORS entirely in the deployed stack.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Served directly from the shared volumes (see docker-compose.prod.yml)
    # rather than proxied — static() in urls.py is a no-op when DEBUG=False,
    # so nginx serving these itself is the actual production path, not just
    # a performance optimization.
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
    }
}

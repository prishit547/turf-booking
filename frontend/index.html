<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#090A0C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxNplay - Book Sports Boxes & Turfs by the Hour</title>
    <!-- Meta description / Open Graph defaults live in App.jsx's root
         <Helmet> instead of here — react-helmet-async only replaces tags
         it manages itself; a static duplicate here would just sit
         alongside the dynamic one rather than being overridden. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Dark-only theme — hardcode the background so there's no
         flash-of-light before the stylesheet loads. */
      html, body { background-color: #090A0C; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

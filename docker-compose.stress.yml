# Resource-limit overlay for load-testing docker-compose.prod.yml under a
# simulated 2 vCPU / 2 GB VM (a cheap VPS tier) — not part of the real
# deployment config (docker-compose.prod.yml has no limits of its own), a
# tool for reproducing stress-test/loadtest.py's results.
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.stress.yml ...
# See stress-test/README.md for the full workflow (seed data, run the load
# test, read the results).
#
# Allocation (sums to 2.0 CPU / ~1.75GB, leaving headroom for OS/Docker
# daemon overhead a real 2GB VM would also lose to the host).
#
# Went through two rebalancing passes:
#  1. First pass gave backend more CPU (funded by trimming db/redis/frontend,
#     which had spare capacity) since backend was the bottleneck. That alone
#     helped CPU-bound work, but backend also switched to 2 worker processes
#     in this same round — which, combined with DB_CONN_MAX_AGE=0 (each
#     request opens a fresh Postgres connection), doubled concurrent
#     connection churn against a db container that pass had just given LESS
#     CPU. Non-cached, DB-heavy endpoints (booked_slots, dashboard_analytics)
#     measurably got worse, not better.
#  2. This pass gives db back more room than backend keeps, since it's now
#     serving twice the concurrent connection attempts it was tuned for.
#   backend (gunicorn+uvicorn, 2 workers): 1.2 cpu / 700m
#   db (postgres):                         0.5 cpu / 512m
#   celery_worker:                         0.15 cpu / 320m
#   redis:                                 0.1 cpu / 128m
#   frontend (nginx):                      0.05 cpu / 64m
services:
  db:
    cpus: 0.5
    mem_limit: 512m
  redis:
    cpus: 0.1
    mem_limit: 128m
  backend:
    cpus: 1.2
    mem_limit: 700m
  celery_worker:
    cpus: 0.15
    mem_limit: 320m
  frontend:
    cpus: 0.05
    mem_limit: 64m
